function calcTotal(session, addons, players) {
  if (!session) return 0;
  const h = Math.max(1, parseInt(players) || 1);
  let base = session.id === "private" ? session.price : session.price * h;
  if (session.id === "team" && base < 500) base = 500;

    const a = ADDONS.find(x => x.id === id);
    return s + (a ? a.price : 0);

}

/* ── FADE HOOK ────────────────────────────────────────────────── */
function useFade() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) el.classList.add("vis"); }, { threshold: 0.1 });
    obs.observe(el); return () => obs.disconnect();
  }, []);
  return ref;
}

/* ── BOOKING FLOW ─────────────────────────────────────────────── */
function BookPage({ bk, setBk, go, freshBooking }) {
  const set  = (k,v) => setBk(p=>({...p,[k]:v}));
  const setF = (k,v) => setBk(p=>({...p,form:{...p.form,[k]:v}}));
  const [loading, setLoading]   = useState(false);
  const [error,   setError]     = useState("");
  const STEPS = 6;

  const canNext = () => {
    if (bk.step===1) return !!bk.who;
    if (bk.step===2) return !!bk.pitcher;
    if (bk.step===3) return !!bk.session;
    if (bk.step===4) return true;
    if (bk.step===5) return !!bk.day && !!bk.time;
    if (bk.step===6) return !!bk.form.name && !!bk.form.email && !!bk.form.phone;
    return false;
  };

  const total = calcTotal(bk.session, bk.addons, bk.players);

  const toggleAO = id => {
    if (id==="elite") { set("addons", bk.addons.includes("elite")?[]:["elite"]); return; }
    const f = bk.addons.filter(x=>x!=="elite");
    set("addons", f.includes(id)?f.filter(x=>x!==id):[...f,id]);
  };

  // ── Stripe Checkout ──────────────────────────────────────────
  const handlePayment = async () => {
    setLoading(true);
    setError("");
    try {
      const addonLabels = bk.addons.map(id => ADDONS.find(a=>a.id===id)?.label).join(", ") || "None";

      // Step 1: Send booking details to Formspree — emails Logan immediately
      const res = await fetch(FORMSPREE_BOOKING, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          name:       bk.form.name,
          email:      bk.form.email,
          phone:      bk.form.phone,
          org:        bk.form.org || "N/A",
          notes:      bk.form.notes || "N/A",
          pitcher:    bk.pitcher ? bk.pitcher.name : "",
          session:    bk.session ? bk.session.label : "",
          addons:     addonLabels,
          day:        bk.day,
          time:       bk.time,
          players:    bk.players,
          total:      "$" + total,
          bookerType: bk.who,
          _subject:   "New ARMD Booking - " + bk.form.name + " - $" + total,
        }),
      });
      if (!res.ok) throw new Error("Booking failed. Please try again.");

      // Step 2: If Stripe is configured redirect to checkout, otherwise confirm directly
      const stripeKey = window.ARMD_STRIPE_KEY;
      const stripePrice = window.ARMD_STRIPE_PRICE;
      const stripeReady = stripeKey && !stripeKey.includes("REPLACE") && stripePrice && !stripePrice.includes("REPLACE");

      if (stripeReady) {
        const stripe = await stripePromise;
        const result = await stripe.redirectToCheckout({
          lineItems: [{ price: stripePrice, quantity: 1 }],
          mode: "payment",
          successUrl: window.location.origin + "?booking=success",
          cancelUrl:  window.location.origin + "?booking=cancelled",
          customerEmail: bk.form.email,
        });
        if (result.error) throw new Error(result.error.message);
      } else {
        // Stripe pending — booking captured via Formspree, confirm immediately
        set("done", true);
        setLoading(false);
      }
    } catch (err) {
      setError(err.message || "Something went wrong. Please try again.");
      setLoading(false);
    }
  };

  // Check for Stripe redirect return
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    if (params.get("booking") === "success") {
      set("done", true);
      window.history.replaceState({}, "", window.location.pathname);
    }
  }, []);

  if (bk.done) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"130px 40px 80px"}}>
      <div style={{maxWidth:520,textAlign:"center"}}>
        <div style={{fontSize:72,marginBottom:24}}>⚾</div>
        <h1 className="bb" style={{fontSize:60,letterSpacing:4,color:"var(--red)",marginBottom:16}}>You're Booked.</h1>
        <p style={{fontSize:16,color:"var(--ink2)",lineHeight:1.75,marginBottom:12,fontWeight:300}}>
          A confirmation email is on its way. Logan will be in touch to confirm your slot.
        </p>
        <button className="btn" onClick={()=>go("home")} style={{fontSize:18,marginTop:32}}>Back to Home</button>
      </div>
    </div>
  );

  return (
    <div style={{paddingTop:100,minHeight:"100vh"}}>
      <div style={{maxWidth:740,margin:"0 auto",padding:"60px 40px"}}>
        <div style={{width:36,height:3,background:"var(--red)",marginBottom:18}}/>
        <h1 className="bb" style={{fontSize:52,letterSpacing:3,marginBottom:40}}>Book a Session</h1>
        <div className="sbar">{Array.from({length:STEPS}).map((_,i)=><div key={i} className={`sseg${i<bk.step?" on":""}`}/>)}</div>
        <div style={{fontSize:11,letterSpacing:2,textTransform:"uppercase",color:"var(--ink3)",marginBottom:32}}>Step {bk.step} of {STEPS}</div>

        {/* Step 1 — Who */}
        {bk.step===1 && <StepWrap title="Who's Booking?" sub="Helps us set up the right session.">
          <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
            {WHO.map(w=>(
              <div key={w.id} className={`card${bk.who===w.id?" sel":""}`} style={{padding:"28px 22px",flex:1,minWidth:140,textAlign:"center"}} onClick={()=>set("who",w.id)}>
                <div style={{fontSize:36,marginBottom:12}}>{w.icon}</div>
                <div className="bb" style={{fontSize:22,letterSpacing:2,marginBottom:6}}>{w.label}</div>
                <div style={{fontSize:13,color:"var(--ink2)",fontWeight:300}}>{w.sub}</div>
              </div>
            ))}
          </div>
        </StepWrap>}

        {/* Step 2 — Pitcher */}
        {bk.step===2 && <StepWrap title="Your Pitcher" sub="Professional experience. Real competition.">
          {PITCHERS.map(p=>(
            <div key={p.id} className={`card${bk.pitcher?.id===p.id?" sel":""}`} style={{padding:"22px 24px",display:"flex",gap:20,alignItems:"center",flexWrap:"wrap"}} onClick={()=>set("pitcher",p)}>
              <div style={{width:50,height:50,minWidth:50,background:p.accent,display:"flex",alignItems:"center",justifyContent:"center",clipPath:"polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%)"}}>
                <span className="bb" style={{fontSize:16,color:"#fff"}}>{p.initials}</span>
              </div>
              <div style={{flex:1}}>
                <div className="bb" style={{fontSize:22,letterSpacing:1,marginBottom:4}}>{p.name}</div>
                <div style={{fontSize:12,color:"var(--ink2)"}}>{p.bg}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div className="bb" style={{fontSize:28,color:p.accent}}>{p.velo}</div>
                <div style={{fontSize:11,color:"var(--ink3)",textTransform:"uppercase",letterSpacing:1}}>mph</div>
              </div>
            </div>
          ))}
        </StepWrap>}

        {/* Step 3 — Session */}
        {bk.step===3 && <StepWrap title="Session Type" sub="Choose based on how many hitters you're bringing.">
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {SESSIONS.map(s=>(
              <div key={s.id} className={`card${bk.session?.id===s.id?" sel":""}`} style={{padding:"22px 26px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:16,flexWrap:"wrap"}} onClick={()=>set("session",s)}>
                <div>
                  <div className="bb" style={{fontSize:26,letterSpacing:2,marginBottom:4}}>{s.label}</div>
                  <div style={{fontSize:13,color:"var(--ink2)",fontWeight:300}}>{s.sub} · {s.desc}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div className="bb" style={{fontSize:40,color:"var(--red)"}}>{fmt(s.price)}</div>
                  <div style={{fontSize:12,color:"var(--ink3)"}}>{s.perLabel}</div>
                </div>
              </div>
            ))}
          </div>
          {bk.session?.id==="team" && (
            <div style={{marginTop:16}}>
              <label className="fl">Number of Hitters</label>
              <input className="fi" type="number" min={1} max={12} value={bk.players} onChange={e=>set("players",e.target.value)} style={{maxWidth:160}}/>
              <div style={{fontSize:13,color:"var(--ink3)",marginTop:8}}>
                Estimated total: <strong style={{color:"var(--red)"}}>{fmt(Math.max(500,parseInt(bk.players||1)*50))}</strong> <span>(minimum $500)</span>
              </div>
            </div>
          )}
        </StepWrap>}

        {/* Step 4 — Add-Ons */}
        {bk.step===4 && <StepWrap title="Add-Ons" sub="Optional — stack any combination, or grab the Elite Bundle and save $50.">
          <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:24}}>
            {ADDONS.map(a=>{
              const on  = bk.addons.includes(a.id);
              const dis = a.id!=="elite" && bk.addons.includes("elite");
              return (
                <div key={a.id} className={`ao${on?" sel":""}`} style={{opacity:dis?.38:1,pointerEvents:dis?"none":"auto",border:a.bundle?"1px solid rgba(200,16,46,.32)":"1px solid var(--bdr)"}} onClick={()=>!dis&&toggleAO(a.id)}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:16}}>

                          {a.bundle&&<span className="chip" style={{background:"rgba(200,16,46,.2)",color:"var(--red)"}}>Saves $50</span>}

            ? <button className="btn" onClick={()=>set("step",bk.step+1)} disabled={!canNext()} style={{fontSize:18}}>Continue →</button>
            : <button className="btn" onClick={handlePayment} disabled={!canNext()||loading} style={{fontSize:18,minWidth:200}}>
                {loading ? <><span className="spinner"/>Processing...</> : `Pay ${fmt(total)} →`}
              </button>
          }
        </div>
      </div>
    </div>
  );
}

function StepWrap({ title, sub, children }) {
  return (
    <div>
      <h2 className="bb" style={{fontSize:36,letterSpacing:2,marginBottom:6}}>{title}</h2>
      <p style={{color:"var(--ink2)",marginBottom:32,fontSize:15,fontWeight:300}}>{sub}</p>
      {children}
    </div>
  );
}

/* ── JOIN AS PITCHER ──────────────────────────────────────────── */
function JoinPage({ go }) {
  const ref = useFade();
  const DAYS_LIST = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const [form, setForm] = useState({name:"",email:"",phone:"",hand:"",velo:"",pitches:"",level:"",orgs:"",video:"",refs:"",avail:[],notes:""});
  const [status,    setStatus]    = useState("idle"); // idle | loading | success | error
  const [errMsg,    setErrMsg]    = useState("");
  const setF = (k,v) => setForm(p=>({...p,[k]:v}));
  const toggleDay = d => setF("avail", form.avail.includes(d)?form.avail.filter(x=>x!==d):[...form.avail,d]);
  const canSubmit = form.name && form.email && form.phone && form.hand && form.velo && form.level;

  const handleSubmit = async () => {
    setStatus("loading");
    setErrMsg("");
    try {
      const res = await fetch(FORMSPREE_PITCHER, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          ...form,
          avail: form.avail.join(", ") || "Not specified",
          _subject: `ARM'D Pitcher Application — ${form.name} — ${form.level}`,
        }),
      });
      if (!res.ok) throw new Error("Submission failed. Please try again.");
      setStatus("success");
    } catch (err) {
      setErrMsg(err.message);
      setStatus("error");
    }
  };

  if (status==="success") return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"130px 40px 80px"}}>
      <div style={{maxWidth:520,textAlign:"center"}}>
        <div style={{fontSize:72,marginBottom:24}}>⚾</div>
        <h1 className="bb" style={{fontSize:60,letterSpacing:4,color:"var(--red)",marginBottom:16}}>Application Sent.</h1>
        <p style={{fontSize:16,color:"var(--ink2)",lineHeight:1.75,marginBottom:40,fontWeight:300}}>
          We'll review your application and reach out to <strong style={{color:"var(--ink)"}}>{form.email}</strong> within 48 hours.
        </p>
        <button className="btn" onClick={()=>go("home")} style={{fontSize:18}}>Back to Home</button>
      </div>
    </div>
  );

  return (
    <div style={{paddingTop:100,minHeight:"100vh"}}>
      <div ref={ref} className="fu" style={{maxWidth:760,margin:"0 auto",padding:"60px 40px"}}>
        <div style={{width:36,height:3,background:"var(--red)",marginBottom:18}}/>
        <h1 className="bb" style={{fontSize:72,letterSpacing:4,marginBottom:10}}>Join ARM'D</h1>
        <p style={{color:"var(--ink2)",fontSize:16,marginBottom:10,fontWeight:300}}>
          Building a roster of elite arms — ex-college and pro pitchers who want to compete, develop hitters, and get paid doing it.
        </p>
        <p style={{color:"var(--ink2)",fontSize:15,marginBottom:48,fontWeight:300}}>Fill out the form below and we'll be in touch within 48 hours.</p>

        {status==="error" && <div className="alert alert-err">{errMsg}</div>}

        <SLabel>Personal Info</SLabel>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
          <div><label className="fl">Full Name *</label><input className="fi" placeholder="John Smith" value={form.name} onChange={e=>setF("name",e.target.value)}/></div>
          <div><label className="fl">Phone *</label><input className="fi" placeholder="(555) 000-0000" value={form.phone} onChange={e=>setF("phone",e.target.value)}/></div>
        </div>
        <div style={{marginBottom:28}}><label className="fl">Email *</label><input className="fi" placeholder="you@example.com" value={form.email} onChange={e=>setF("email",e.target.value)}/></div>

        <SLabel>Pitching Profile</SLabel>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
          <div>
            <label className="fl">Throwing Hand *</label>
            <select className="fi" value={form.hand} onChange={e=>setF("hand",e.target.value)} style={{cursor:"pointer",appearance:"auto"}}>
              <option value="">Select...</option>
              <option value="RHP">RHP — Right-Handed</option>
              <option value="LHP">LHP — Left-Handed</option>
            </select>
          </div>
          <div><label className="fl">Velocity Range *</label><input className="fi" placeholder="88–94 mph" value={form.velo} onChange={e=>setF("velo",e.target.value)}/></div>
        </div>
        <div style={{marginBottom:28}}><label className="fl">Pitch Arsenal</label><input className="fi" placeholder="Fastball, Slider, Changeup..." value={form.pitches} onChange={e=>setF("pitches",e.target.value)}/></div>

        <SLabel>Experience</SLabel>
        <div style={{marginBottom:12}}>
          <label className="fl">Highest Level Played *</label>
          <select className="fi" value={form.level} onChange={e=>setF("level",e.target.value)} style={{cursor:"pointer",appearance:"auto"}}>
            <option value="">Select...</option>
            <option value="HS">High School</option>
            <option value="JUCO">JUCO</option>
            <option value="D3">Division III</option>
            <option value="D2">Division II</option>
            <option value="D1">Division I</option>
            <option value="Indy">Independent Pro</option>
            <option value="MiLB">Minor League (MiLB)</option>
            <option value="MLB">MLB</option>
          </select>
        </div>
        <div style={{marginBottom:28}}><label className="fl">Teams / Organizations</label><input className="fi" placeholder="University of Florida, Twins org, Atlantic League..." value={form.orgs} onChange={e=>setF("orgs",e.target.value)}/></div>

        <SLabel>Availability</SLabel>
        <p style={{fontSize:13,color:"var(--ink2)",marginBottom:14,fontWeight:300}}>Select all days you're generally available to throw.</p>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:28}}>
          {DAYS_LIST.map(d=><button key={d} className={"dchip"+(form.avail.includes(d)?" sel":"")} onClick={()=>toggleDay(d)}>{d}</button>)}
        </div>

        <SLabel>Video & References</SLabel>
        <div style={{marginBottom:12}}><label className="fl">Pitching Video Link (YouTube, Hudl, etc.)</label><input className="fi" placeholder="https://..." value={form.video} onChange={e=>setF("video",e.target.value)}/></div>
        <div style={{marginBottom:28}}><label className="fl">References (name + contact)</label><textarea className="fi" rows={3} style={{resize:"vertical"}} placeholder="Coach Mike Johnson — (555) 123-4567" value={form.refs} onChange={e=>setF("refs",e.target.value)}/></div>

        <SLabel>Anything Else</SLabel>
        <div style={{marginBottom:40}}><textarea className="fi" rows={3} style={{resize:"vertical"}} placeholder="Injury history, location, why you want to join ARM'D..." value={form.notes} onChange={e=>setF("notes",e.target.value)}/></div>

        <button className="btn" style={{fontSize:20,width:"100%",textAlign:"center",padding:"18px",clipPath:"none"}} disabled={!canSubmit||status==="loading"} onClick={handleSubmit}>
          {status==="loading" ? <><span className="spinner"/>Submitting...</> : "Submit Application"}
        </button>
        {!canSubmit && <p style={{fontSize:12,color:"var(--ink3)",textAlign:"center",marginTop:12}}>Complete all required fields (*) to submit.</p>}
      </div>
      <Footer/>
    </div>
  );
}

function SLabel({ children }) {
  return (
    <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:20}}>
      <div style={{width:24,height:2,background:"var(--red)"}}/>
      <span className="bb" style={{fontSize:18,letterSpacing:2,color:"var(--ink2)"}}>{children}</span>
      <div style={{flex:1,height:1,background:"var(--bdr)"}}/>
    </div>
  );
}

/* ── FOOTER ───────────────────────────────────────────────────── */
function Footer() {
  return (
    <footer style={{borderTop:"1px solid var(--bdr)",padding:"48px 40px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:24,marginTop:40}}>
      <div>
        <div className="bb" style={{fontSize:28,letterSpacing:3,marginBottom:4}}>ARM'D</div>
        <div style={{fontSize:11,color:"var(--ink3)",letterSpacing:1}}>Live Pitching · On Demand</div>
      </div>
      <div style={{fontSize:12,color:"var(--ink3)"}}>&copy; 2025 ARM'D. All rights reserved.</div>
    </footer>
  );
}


    /* ── MOUNT ── */
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
